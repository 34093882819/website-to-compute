<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MOVIMENTÔMETRO</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #00ff99;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      font-size: 4em;
      margin-bottom: 0.2em;
      text-shadow: 0 0 10px #00ff99;
    }

    #counter {
      font-size: 6em;
      font-weight: bold;
      text-shadow: 0 0 20px #00ff99;
    }
  </style>
</head>
<body>
  <h1>MOVIMENTÔMETRO</h1>
  <div id="counter">Carregando...</div>

  <script>
    const startDate = new Date("2024-07-17T00:00:00Z"); // Data fixa em UTC
    const baseValue = 899000;
    const ratePerSecond = 0.057;
    const counterEl = document.getElementById("counter");

    function updateCounter() {
      const now = new Date();
      const secondsElapsed = (now - startDate) / 1000;
      const value = baseValue + secondsElapsed * ratePerSecond;
      counterEl.textContent = value.toLocaleString("pt-BR", {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      });
    }

    setInterval(updateCounter, 100);
    updateCounter();
  </script>
</body>
</html>
